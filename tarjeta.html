<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados ProKart</title>
<style>
body{margin:0;font-family:Arial;background:#0d0d0d;color:#fff}
.container{max-width:600px;margin:auto;padding:15px}
select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#1a1a1a;color:#fff}
.card{background:#1a1a1a;border-radius:12px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.pos{font-size:20px;font-weight:bold;width:40px}
.name{flex:1}
.name a{color:#fff;text-decoration:none}
.points{font-weight:bold}
.up{color:#4caf50;font-weight:bold;margin-left:5px}
.down{color:#f44336;font-weight:bold;margin-left:5px}
.gold{background:#ffd70022}
.silver{background:#c0c0c022}
.bronze{background:#cd7f3222}
</style>
</head>
<body>
<div class="container">
<select id="categoria"></select>
<select id="fecha"></select>
<div id="resultados"></div>
</div>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=1201386360&single=true&output=csv";

let datos=[];
let rankingAnterior={};

function parseCSV(text){
 return text.split("\n").map(r=>r.split(","));
}

async function cargar(){
 const res=await fetch(SHEET);
 const txt=await res.text();
 const filas=parseCSV(txt);
 const headers=filas[0];

 datos=filas.slice(1).map(f=>({
  fecha:f[headers.indexOf("Fecha")],
  categoria:f[headers.indexOf("Categoria")],
  piloto:f[headers.indexOf("Piloto")],
  id:f[headers.indexOf("PilotoID")],
  puntos:Number(f[headers.indexOf("Puntos")])||0
 })).filter(d=>d.fecha);

 cargarCategorias();
}

function cargarCategorias(){
 const cats=[...new Set(datos.map(d=>d.categoria))];
 categoria.innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
 cargarFechas();
}

function cargarFechas(){
 const cat=categoria.value;
 const fechas=[...new Set(datos.filter(d=>d.categoria===cat).map(d=>d.fecha))];

 fecha.innerHTML=fechas.map(f=>`<option>${f}</option>`).join("");

 // AUTO seleccionar última fecha
 fecha.selectedIndex=fechas.length-1;

 mostrar();
}

function mostrar(){
 const cat=categoria.value;
 const fec=fecha.value;

 const actual=datos.filter(d=>d.categoria===cat && d.fecha===fec);
 const prevFecha=[...new Set(datos.filter(d=>d.categoria===cat).map(d=>d.fecha))];
 const indexActual=prevFecha.indexOf(fec);
 const fechaAnterior=prevFecha[indexActual-1];

 const anterior=datos.filter(d=>d.categoria===cat && d.fecha===fechaAnterior);

 const rankPrev={};
 anterior.sort((a,b)=>b.puntos-a.puntos).forEach((d,i)=>{
  rankPrev[d.id]=i+1;
 });

 const orden=actual.sort((a,b)=>b.puntos-a.puntos);

 resultados.innerHTML=orden.map((d,i)=>{
  let clase="";
  if(i==0) clase="gold";
  if(i==1) clase="silver";
  if(i==2) clase="bronze";

  let indicador="";
  if(rankPrev[d.id]){
   if(rankPrev[d.id] > i+1) indicador=`<span class="up">▲</span>`;
   else if(rankPrev[d.id] < i+1) indicador=`<span class="down">▼</span>`;
  }

  return `
  <div class="card ${clase}">
   <div class="pos">${i+1}</div>
   <div class="name">
     <a href="piloto.html?id=${encodeURIComponent(d.id)}">${d.piloto}</a>
     ${indicador}
   </div>
   <div class="points">${d.puntos}</div>
  </div>`;
 }).join("");
}

categoria.onchange=cargarFechas;
fecha.onchange=mostrar;

cargar();
</script>
</body>
</html>
