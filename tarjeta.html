<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados ProKart</title>

<style>
body{margin:0;font-family:Arial;background:#0d0d0d;color:#fff}

/* HEADER APP */
.header{
 position:sticky;
 top:0;
 background:rgba(20,20,20,0.85);
 backdrop-filter:blur(10px);
 padding:12px 15px;
 z-index:1000;
 border-bottom:1px solid #222;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.header h1{margin:0;font-size:16px}

/* BOTON VOLVER */
.btn-back{
 background:#1a1a1a;
 border:none;
 color:#fff;
 padding:8px 12px;
 border-radius:8px;
 text-decoration:none;
 font-size:13px;
}

/* CONTENEDOR */
.container{max-width:600px;margin:auto;padding:10px}

/* SELECTORES */
.label{
 font-size:11px;
 color:#aaa;
 margin:10px 5px 5px;
 display:flex;
 gap:6px;
 text-transform:uppercase;
}
.select-box{
 background:#1a1a1a;
 border-radius:12px;
 padding:5px 10px;
 margin-bottom:10px;
 box-shadow:inset 0 0 0 1px #2a2a2a;
}
select{
 width:100%;
 padding:12px;
 border:none;
 background:transparent;
 color:#fff;
 font-size:14px;
 outline:none;
}

/* LISTA */
.lista{scroll-snap-type:y mandatory}

/* TARJETAS */
.card{
 background:#1a1a1a;
 border-radius:12px;
 padding:15px;
 margin:10px 0;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 4px 10px rgba(0,0,0,.5);
 transition:.3s;
 scroll-snap-align:start;
}
.card:hover{transform:scale(1.02)}

.pos{font-size:20px;font-weight:bold;width:40px}
.name{flex:1}
.name a{color:#fff;text-decoration:none}
.points{font-weight:bold}

/* INDICADORES */
.up{color:#4caf50;margin-left:5px}
.down{color:#f44336;margin-left:5px}

/* PODIO */
.gold{background:#ffd70022}
.silver{background:#c0c0c022}
.bronze{background:#cd7f3222}

/* ANIMACION */
.fade-in{animation:fade .4s ease}
@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="header">
 <a href="index.html" class="btn-back">← Volver</a>
 <h1>🏁 Resultados</h1>
</div>

<div class="container">

<div class="label">🏁 Categoría</div>
<div class="select-box">
<select id="categoria"></select>
</div>

<div class="label">📅 Fecha</div>
<div class="select-box">
<select id="fecha"></select>
</div>

<div id="resultados" class="lista"></div>

</div>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=1201386360&single=true&output=csv";

let datos=[];

function parseCSV(text){
 return text.split("\n").map(r=>r.split(","));
}

async function cargar(){
 const res=await fetch(SHEET);
 const txt=await res.text();
 const filas=parseCSV(txt);
 const headers=filas[0];

 datos=filas.slice(1).map(f=>({
  fecha:f[headers.indexOf("Fecha")],
  categoria:f[headers.indexOf("Categoria")],
  piloto:f[headers.indexOf("Piloto")],
  id:f[headers.indexOf("PilotoID")],
  puntos:Number(f[headers.indexOf("Puntos")])||0
 })).filter(d=>d.fecha);

 cargarCategorias();
}

function cargarCategorias(){
 const cats=[...new Set(datos.map(d=>d.categoria))];
 categoria.innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
 cargarFechas();
}

function cargarFechas(){
 const cat=categoria.value;
 const fechas=[...new Set(datos.filter(d=>d.categoria===cat).map(d=>d.fecha))];

 fecha.innerHTML=fechas.map(f=>`<option>${f}</option>`).join("");
 fecha.selectedIndex=fechas.length-1;

 mostrar();
}

function mostrar(){
 const cat=categoria.value;
 const fec=fecha.value;

 const actual=datos.filter(d=>d.categoria===cat && d.fecha===fec);
 const todas=[...new Set(datos.filter(d=>d.categoria===cat).map(d=>d.fecha))];
 const i=todas.indexOf(fec);
 const anterior=datos.filter(d=>d.categoria===cat && d.fecha===todas[i-1]);

 const rankPrev={};
 anterior.sort((a,b)=>b.puntos-a.puntos).forEach((d,i)=>rankPrev[d.id]=i+1);

 const orden=actual.sort((a,b)=>b.puntos-a.puntos);

 resultados.innerHTML=orden.map((d,i)=>{
  let clase=i==0?"gold":i==1?"silver":i==2?"bronze":"";

  let indicador="";
  if(rankPrev[d.id]){
   if(rankPrev[d.id]>i+1) indicador='<span class="up">▲</span>';
   else if(rankPrev[d.id]<i+1) indicador='<span class="down">▼</span>';
  }

  return `<div class="card fade-in ${clase}">
   <div class="pos">${i+1}</div>
   <div class="name">
     <a href="piloto.html?id=${encodeURIComponent(d.id)}">${d.piloto}</a>
     ${indicador}
   </div>
   <div class="points">${d.puntos}</div>
  </div>`;
 }).join("");
}

categoria.onchange=cargarFechas;
fecha.onchange=mostrar;

cargar();
</script>

</body>
</html>
