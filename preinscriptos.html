<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preinscriptos por Fecha | PROKART</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{--rojo:#e10600;--negro:#111;--gris:#f4f4f4}
body{margin:0;font-family:'Oswald',Arial;background:var(--gris)}
header{background:#000;color:#fff;text-align:center;padding:50px 20px}
section{max-width:1100px;margin:auto;padding:50px 20px}
h2{border-left:6px solid var(--rojo);padding-left:15px}
table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:center}
th{background:#111;color:#fff}
td:nth-child(2){text-align:left;padding-left:15px}
a{color:#e10600;text-decoration:none}
a:hover{text-decoration:underline}
.categoria{margin-bottom:60px}
.volver{
display:inline-block;
margin-top:30px;
background:var(--rojo);
color:#fff;
padding:12px 20px;
text-decoration:none;
border-radius:6px;
}
</style>
</head>

<body>

<header>
<h1 id="tituloFecha"></h1>
</header>

<section id="contenedor"></section>

<section style="text-align:center">
<a href="index.html" class="volver">Volver al Inicio</a>
</section>


<!-- ================= LISTA DE INSCRIPTOS ================= -->
<section id="lista-inscriptos">
  <h2>Pilotos Confirmados para esta fecha</h2>
  <div id="contenedor-grupos" class="grid">
    <!-- Aquí se cargarán las categorías y sus pilotos -->
    <p>Cargando lista de pilotos...</p>
  </div>
</section>

<style>
  .categoria-grupo {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .categoria-grupo h3 {
    color: var(--rojo);
    border-bottom: 2px solid var(--gris);
    padding-bottom: 10px;
    margin-top: 0;
  }
  .lista-pilotos {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .lista-pilotos li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
  }
  .lista-pilotos li:last-child { border: none; }
  .num-piloto { font-weight: bold; color: var(--negro); }
</style>
  <script>
// URL de tu Sheet de inscripciones (Publicada como CSV)
const SHEET_INSCRIPTOS = "TU_URL_DE_RESPUESTAS_AQUI_CSV";

async function cargarInscriptos() {
  try {
    const respuesta = await fetch(SHEET_INSCRIPTOS);
    const texto = await respuesta.text();
    const filas = parseCSV(texto); // Usamos tu función parseCSV ya existente

    const cabecera = filas[0];
    // Ajusta estos nombres a como figuran exactamente en tu Excel
    const idxCat = cabecera.indexOf("Categoría"); 
    const idxNom = cabecera.indexOf("Nombre y Apellido");
    const idxNum = cabecera.indexOf("Número de Kart");

    const inscriptos = filas.slice(1).map(f => ({
      categoria: f[idxCat],
      nombre: f[idxNom],
      numero: f[idxNum]
    })).filter(i => i.categoria && i.nombre);

    // AGRUPAR POR CATEGORÍA
    const agrupados = inscriptos.reduce((acc, piloto) => {
      if (!acc[piloto.categoria]) acc[piloto.categoria] = [];
      acc[piloto.categoria].push(piloto);
      return acc;
    }, {});

    renderizarInscriptos(agrupados);
  } catch (error) {
    console.error("Error cargando inscriptos:", error);
  }
}

function renderizarInscriptos(grupos) {
  const contenedor = document.getElementById("contenedor-grupos");
  contenedor.innerHTML = ""; // Limpiar mensaje de carga

  for (const categoria in grupos) {
    const div = document.createElement("div");
    div.className = "categoria-grupo";
    
    const listaHtml = grupos[categoria].map(p => `
      <li>
        <span>${p.nombre}</span>
        <span class="num-piloto">#${p.numero || 'S/N'}</span>
      </li>
    `).join("");

    div.innerHTML = `
      <h3>${categoria}</h3>
      <ul class="lista-pilotos">
        ${listaHtml}
      </ul>
    `;
    contenedor.appendChild(div);
  }
}

// Llamar a la función al cargar
cargarInscriptos();
</script>

</body>
</html>
