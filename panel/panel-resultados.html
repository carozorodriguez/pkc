<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Resultados | PROKART</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --rojo:#e10600;
  --negro:#111;
  --gris:#f4f4f4;
}

body{
  margin:0;
  font-family:'Oswald',Arial;
  background:var(--gris);
}

header{
  background:#000;
  color:#fff;
  padding:40px 20px;
  text-align:center;
}

section{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 5px 18px rgba(0,0,0,.15);
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 18px;
  background:var(--rojo);
  color:#fff;
  text-decoration:none;
  border-radius:6px;
}

.stats p{
  margin:8px 0;
  font-size:18px;
}

.volver{
  text-align:center;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <h1>Panel de Resultados</h1>
  <p>Control de Cargas Oficiales</p>
</header>

<section>

<!-- ========================================================= -->
<!-- 🏁 FORMULARIO CARGA DE RESULTADOS -->
<!-- ========================================================= -->

<div class="card">
  <h3>📋 Cargar Resultados</h3>

  <form id="formResultados">

    <label>Fecha</label><br>
    <input type="text" id="fechaResultado" placeholder="Ej: Fecha 3" required><br><br>

    <label>Categoría</label><br>
    <select id="categoriaResultado" required>
      <option value="">Seleccione categoría</option>
    </select><br><br>

    <label>Piloto</label><br>
    <select id="pilotoResultado" required>
      <option value="">Seleccione piloto</option>
    </select><br><br>

    <label>Puntos</label><br>
    <input type="number" id="puntosResultado" required><br><br>

    <label>Puesto</label><br>
<input type="number" id="puestoResultado" required><br><br>

    <label>Observación</label><br>
<input type="text" id="observacionResultado"><br><br>

    <button type="submit" class="btn">Guardar Resultado</button>

  </form>
</div>

<!-- ========================================================= -->
<!-- 📊 ESTADO ACTUAL -->
<!-- ========================================================= -->

<div class="card stats">
  <h3>📊 Estado Actual</h3>
  <p><strong>Última fecha cargada:</strong> <span id="ultimaFecha">Cargando...</span></p>
  <p><strong>Pilotos en esa fecha:</strong> <span id="pilotosUltima">—</span></p>
  <p><strong>Total de registros:</strong> <span id="totalRegistros">—</span></p>
</div>

<!-- ========================================================= -->
<!-- 🏆 RECALCULAR CAMPEONATO -->
<!-- ========================================================= -->

<div class="card">
  <h3>🏆 Recalcular Campeonato</h3>
  <button class="btn" onclick="recalcular()">Recalcular Ahora</button>
  <div id="resultadoCampeonato" style="margin-top:20px;"></div>
</div>

<div class="volver">
  <a class="btn" href="index.html">Volver al Panel</a>
</div>

</section>

<script src="auth.js"></script>

<script>

/* =========================================================
   🔧 CONFIGURACIÓN GLOBAL
========================================================= */

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysrY6r-WN3aoYLun3s5i811npVI9Tl4zDvhHAtzHgrP39yOFoxyIvBm4UgV4z-uTvE/exec";

const SHEET_RESULTADOS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=1201386360&single=true&output=csv";

const SHEET_PILOTOS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=2063656949&single=true&output=csv";

function limpiar(v){
  return v?.replace(/^"|"$/g,'').trim();
}

/* =========================================================
   🚗 CARGAR PILOTOS ACTIVOS
========================================================= */

let pilotosActivos = [];

function cargarPilotosBase(){

fetch(SHEET_PILOTOS_URL)
.then(r=>r.text())
.then(csv=>{

  const filas = csv.split(/\r?\n/)
  .slice(1)
  .filter(f=>f.trim()!=='');

  pilotosActivos = filas.map(f=>{

  const col = f.split(",");

  return {
    id: col[0]?.trim(),
    categoria: col[1]?.trim(),
    numero: col[2]?.trim(),
    nombre: col[3]?.trim(),
    estado: col[9]?.trim()
  };

}).filter(p=>p.estado === "Activo");
    return {
      id: limpiar(col[0]),
      categoria: limpiar(col[1]),
      numero: limpiar(col[2]),
      nombre: limpiar(col[3]),
      estado: limpiar(col[9])
    };

  }).filter(p=>p.estado==="Activo");

  cargarCategorias();

});

}

function cargarCategorias(){

const categorias = [...new Set(pilotosActivos.map(p=>p.categoria))];

const select = document.getElementById("categoriaResultado");

select.innerHTML = '<option value="">Seleccione categoría</option>';

categorias.sort().forEach(cat=>{

select.innerHTML += `<option value="${cat}">${cat}</option>`;

});

}

/* =========================================================
   🚗 FILTRAR PILOTOS POR CATEGORÍA
========================================================= */

document.getElementById("categoriaResultado")
.addEventListener("change", function(){

const categoria = this.value;

const filtrados = pilotosActivos
.filter(p=>p.categoria===categoria)
.sort((a,b)=>Number(a.numero)-Number(b.numero));

const selectPiloto = document.getElementById("pilotoResultado");

selectPiloto.innerHTML = '<option value="">Seleccione piloto</option>';

filtrados.forEach(p=>{

selectPiloto.innerHTML += `
<option value="${p.id}">
#${p.numero} - ${p.nombre}
</option>
`;

});

});


/* =========================================================
   📝 ENVIAR RESULTADO AL APPS SCRIPT
========================================================= */

document.getElementById("formResultados")
.addEventListener("submit", function(e){

e.preventDefault();

const fecha = document.getElementById("fechaResultado").value.trim();
const categoria = document.getElementById("categoriaResultado").value;
const pilotoID = document.getElementById("pilotoResultado").value;
const puntos = document.getElementById("puntosResultado").value;
const puesto = document.getElementById("puestoResultado").value;
const observacion = document.getElementById("observacionResultado").value;

if(!fecha || !categoria || !pilotoID || !puntos){

alert("Complete todos los campos");

return;

}

const pilotoObj = pilotosActivos.find(p=>p.id===pilotoID);

const datos = new FormData();

datos.append("accion","cargarResultado");
datos.append("fecha",fecha);
datos.append("categoria",categoria);
datos.append("piloto",pilotoObj.nombre);
datos.append("numero",pilotoObj.numero);
datos.append("puntos",puntos);
datos.append("puesto",puesto);
datos.append("observacion",observacion);

fetch(APPS_SCRIPT_URL,{
method:"POST",
body:datos
})
.then(r=>r.text())
.then(res=>{

if(res.includes("ERROR")){
alert(res);
return;
}

alert("Resultado cargado correctamente");

document.getElementById("formResultados").reset();

})
.catch(err=>{

console.error(err);
alert("Error de conexión con Apps Script");

});

});


/* =========================================================
   📊 RECALCULAR CAMPEONATO
========================================================= */

function recalcular(){

const contenedor = document.getElementById("resultadoCampeonato");

contenedor.innerHTML="Calculando...";

fetch(SHEET_RESULTADOS_URL)
.then(r=>r.text())
.then(csv=>{

const filas = csv.split(/\r?\n/).filter(f=>f.trim()!=='');

if(filas.length<2){

contenedor.innerHTML="Sin datos disponibles.";

return;

}

const encabezados = filas[0].split(",").map(h=>h.trim().toLowerCase());

const idxCategoria = encabezados.indexOf("categoria");
const idxPiloto = encabezados.indexOf("piloto");
const idxPuntos = encabezados.indexOf("puntos");

if(idxCategoria==-1 || idxPiloto==-1 || idxPuntos==-1){

contenedor.innerHTML="Error: columnas no encontradas.";

return;

}

const datos = filas.slice(1).map(f=>{

const col = f.split(",");

return{
categoria:col[idxCategoria],
piloto:col[idxPiloto],
puntos:Number(col[idxPuntos])||0
};

});

const categorias=[...new Set(datos.map(d=>d.categoria))];

let html="";

categorias.forEach(cat=>{

const ranking={};

datos
.filter(d=>d.categoria===cat)
.forEach(d=>{

ranking[d.piloto]=(ranking[d.piloto]||0)+d.puntos;

});

const ordenado=Object.entries(ranking)
.sort((a,b)=>b[1]-a[1]);

html+=`<div class="card"><h3>${cat}</h3>`;

ordenado.forEach((p,i)=>{

html+=`${i+1}° - ${p[0]} — ${p[1]} pts<br>`;

});

html+=`</div>`;

});

contenedor.innerHTML=html;

})
.catch(err=>{

console.error(err);

contenedor.innerHTML="Error al calcular.";

});

}

/* ========================================================= */

cargarPilotosBase();

</script>

</body>
</html>
