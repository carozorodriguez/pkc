<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha del Piloto | PROKART CALETENSE</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --rojo:#e10600;
  --negro:#111;
  --gris:#f4f4f4;
}

body{
  margin:0;
  font-family:'Oswald',Arial;
  background:var(--gris);
}

/* ===============================
   HEADER
================================ */
header{
  background:#000;
  color:#fff;
  text-align:center;
  padding:40px 20px;
}

/* ===============================
   CONTENIDO
================================ */
section{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.btn{
  display:inline-block;
  margin:10px 5px 0 0;
  padding:12px 18px;
  background:var(--rojo);
  color:#fff;
  text-decoration:none;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-family:'Oswald';
}

.btn:hover{opacity:.85}

/* ===============================
   DATOS PILOTO
================================ */
.piloto-header{
  display:grid;
  grid-template-columns:220px 1fr 160px;
  gap:30px;
  align-items:center;
}

.piloto-header img{
  width:100%;
  border-radius:12px;
  border:4px solid var(--negro);
}

#qrPiloto img{
  width:140px;
}

/* ===============================
   TITULOS
================================ */
h1{margin:0}
h3{
  margin-top:35px;
  border-left:5px solid var(--rojo);
  padding-left:12px;
}

/* ===============================
   TABLAS
================================ */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

th{
  background:var(--negro);
  color:#fff;
}

/* ===============================
   ACCIONES
================================ */
.acciones{
  margin-top:30px;
  text-align:center;
}

/* ===============================
   FOOTER
================================ */
footer{
  background:#000;
  color:#fff;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

.sponsors img{
  height:45px;
  margin:0 10px;
}

/* ===============================
   IMPRESIÓN
================================ */
@media print{
  .acciones,
  footer{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <h1>Ficha del Piloto</h1>
</header>

<section>

<div class="card" id="fichaPiloto">

  <!-- DATOS PRINCIPALES -->
  <div class="piloto-header">
    <img id="fotoPiloto" src="" alt="Foto del piloto">

    <div>
      <h1 id="nombrePiloto"></h1>
      <p><strong>Categoría:</strong> <span id="categoriaPiloto"></span></p>
    </div>

    <div id="qrPiloto"></div>
  </div>

  <!-- ESTADÍSTICAS -->
  <h3>Estadísticas</h3>
  <table>
    <thead>
      <tr>
        <th>Carreras</th>
        <th>Puntos</th>
        <th>Mejor Puesto</th>
        <th>Promedio</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td id="statCarreras">0</td>
        <td id="statPuntos">0</td>
        <td id="statMejor">—</td>
        <td id="statPromedio">—</td>
      </tr>
    </tbody>
  </table>

  <!-- HISTORIAL -->
  <h3>Historial de Carreras</h3>
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Puesto</th>
        <th>Puntos</th>
        <th>Observación</th>
      </tr>
    </thead>
    <tbody id="tablaHistorial"></tbody>
  </table>

  <!-- ACCIONES -->
  <div class="acciones">
    <button class="btn" onclick="window.print()">🖨️ Imprimir / Exportar PDF</button>
    <a class="btn" href="index.html">⬅ Volver al Campeonato</a>
  </div>

</div>

</section>

<!-- FOOTER -->
<footer>
  <div class="sponsors">
    <img src="sponsors/vintage.png" alt="Vintage Motors 4T">
   <img src="sponsors/caleta.png" alt="Repuestos Santiago">
 <img src="sponsors/dany.png" alt="Dany Kart">
  </div>
  <p>© 2026 PROKART CALETENSE</p>
</footer>

<script>

/* =====================================================
   1) OBTENER ID DESDE LA URL
===================================================== */

const params = new URLSearchParams(window.location.search);
const id = params.get("id")?.trim();

if(!id){
  document.getElementById("nombrePiloto").textContent = "Piloto no encontrado";
  throw new Error("ID no definido en URL");
}

// Separar categoria y numero
const [categoria, numero] = id.split("_");


/* =====================================================
   2) URL DE GOOGLE SHEETS
===================================================== */

const SHEET_RESULTADOS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=1201386360&single=true&output=csv";

const SHEET_PILOTOS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=2063656949&single=true&output=csv";


/* =====================================================
   3) PARSEADOR DE CSV
===================================================== */

function parseCSV(text){
  return text.split("\n").map(row =>
    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
       .map(c => c.replace(/^"|"$/g,'').trim())
  );
}


/* =====================================================
   4) FUNCIÓN PRINCIPAL
===================================================== */

async function cargarPiloto(){

  /* -------------------------------------------
     4.1 CARGAR PILOTOS
  --------------------------------------------*/

  const rPil = await fetch(SHEET_PILOTOS);
  const tPil = await rPil.text();
  const fPil = parseCSV(tPil);

  const hPil = fPil[0].map(h => h.trim().toUpperCase());

  const iID   = hPil.indexOf("ID");
  const iNom  = hPil.indexOf("NOMBRE");
  const iFoto = hPil.indexOf("FOTOURL");

  let nombrePiloto = "";
  let fotoURL = "";

  fPil.slice(1).forEach(f=>{

    const idSheet = f[iID]?.trim();

    if(idSheet && idSheet.toUpperCase() === id.toUpperCase()){

      nombrePiloto = f[iNom]?.trim();
      fotoURL = f[iFoto]?.trim();

    }

  });

  document.getElementById("nombrePiloto").textContent =
    nombrePiloto || id;

  document.getElementById("categoriaPiloto").textContent =
    categoria;


  /* -------------------------------------------
     4.2 CARGAR FOTO DEL PILOTO
  --------------------------------------------*/

  const img = document.getElementById("fotoPiloto");

  if(fotoURL){

    if(fotoURL.startsWith("http")){
      img.src = fotoURL;
    }else{
      img.src = "pilotos/" + fotoURL;
    }

  }else{
    img.src = "pilotos/default.jpg";
  }

  img.onerror = function(){
    this.onerror = null;
    this.src = "pilotos/default.jpg";
  };

  /* -------------------------------------------
     4.3 CARGAR RESULTADOS
  --------------------------------------------*/

  const rRes = await fetch(SHEET_RESULTADOS);
  const tRes = await rRes.text();
  const fRes = parseCSV(tRes);

  const hRes = fRes[0].map(h => h.trim().toUpperCase());

  const iFecha    = hRes.indexOf("FECHA");
  const iPilotoID = hRes.indexOf("PILOTOID");
  const iPuesto   = hRes.indexOf("PUESTO");
  const iPts      = hRes.indexOf("PUNTOS");
  const iObs      = hRes.indexOf("OBSERVACION");

  const tabla = document.getElementById("tablaHistorial");
  tabla.innerHTML = "";

  let carreras = 0;
  let puntos = 0;
  let mejor = 999;

  /* FILTRAR RESULTADOS DEL PILOTO */

  const datosPiloto = fRes.slice(1).filter(f =>
    f[iPilotoID]?.trim().toUpperCase() === id.toUpperCase()
  );

  /* RECORRER RESULTADOS */

  datosPiloto.forEach(f => {

    const fecha = f[iFecha];
    const puesto = Number(f[iPuesto]) || 0;
    const pts = Number(f[iPts]) || 0;
    const obs = f[iObs] || "—";

    carreras++;
    puntos += pts;

    if(puesto && puesto < mejor) mejor = puesto;

    tabla.innerHTML += `
      <tr>
        <td>${fecha}</td>
        <td>${puesto || "—"}</td>
        <td>${pts}</td>
        <td>${obs}</td>
      </tr>
    `;

  });


  /* -------------------------------------------
     4.4 ESTADÍSTICAS
  --------------------------------------------*/

  document.getElementById("statCarreras").textContent = carreras;

  document.getElementById("statPuntos").textContent = puntos;

  document.getElementById("statMejor").textContent =
    carreras ? mejor + "°" : "—";

}


/* =====================================================
   5) GENERAR QR DE LA FICHA
===================================================== */

document.getElementById("qrPiloto").innerHTML =
`<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(location.href)}">`;


/* =====================================================
   6) INICIAR
===================================================== */

cargarPiloto();

</script>
</body>
</html>
