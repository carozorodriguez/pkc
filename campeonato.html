<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeonato Oficial 2026 | PROKART</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{--rojo:#e10600;--negro:#111;--gris:#f4f4f4}
body{margin:0;font-family:'Oswald',Arial;background:var(--gris)}
header{background:#000;color:#fff;text-align:center;padding:60px 20px}
section{max-width:1100px;margin:auto;padding:60px 20px}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:center}
th{background:var(--negro);color:#fff}
td:nth-child(2){text-align:left;padding-left:15px}
tbody tr:nth-child(1){background:#ffd70033;font-weight:700}
tbody tr:nth-child(2){background:#c0c0c033}
tbody tr:nth-child(3){background:#cd7f3233}
tbody tr:hover{background:#f1f1f1}

.volver{
display:inline-block;
margin-top:30px;
background:var(--rojo);
color:#fff;
padding:12px 20px;
text-decoration:none;
border-radius:6px;
}

a{color:var(--rojo);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== TARJETA LIDER ===== */

.lider-card{
  background: linear-gradient(135deg, #111, #2a2a2a);
  color:#fff;
  border-radius:18px;
  padding:30px;
  display:flex;
  align-items:center;
  gap:30px;
  flex-wrap:wrap;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
  border:3px solid var(--rojo);
}

.lider-card img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:16px;
  border:4px solid #fff;
}

.lider-info h2{
  margin:0;
  font-size:28px;
  color:#ffd700;
  letter-spacing:1px;
}

.lider-info h3{
  margin:10px 0;
  font-size:26px;
}

.lider-info .puntos{
  font-size:22px;
  font-weight:700;
  margin-top:10px;
}

.lider-info .extra{
  margin-top:10px;
  font-size:16px;
  opacity:.9;
}
  @keyframes fadeSlide {
  from {
    opacity:0;
    transform:translateY(20px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.lider-card{
  animation:fadeSlide .6s ease-out;
}

.badge-campeon{
  display:inline-block;
  margin-top:12px;
  padding:6px 12px;
  border-radius:20px;
  font-size:14px;
  font-weight:700;
}

.habilitado{
  background:#ffd700;
  color:#000;
}

.no-habilitado{
  background:#444;
  color:#fff;
}

</style>
</head>

<body>

<header>
<h1>Campeonato Oficial 2026</h1>
<p>Tabla General Acumulada</p>
</header>

<section>

<select id="categoriaSelectCampeonato"></select>

<div id="liderCard" style="margin-top:20px;"></div>

<table id="tablaCampeonato">
  <thead>
    <tr>
      <th>Pos</th>
      <th>Piloto</th>
      <th>Total Puntos</th>
      <th>Victorias</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div style="text-align:center">
<a href="index.html" class="volver">Volver al Inicio</a>
</div>

</section>

<script>

/* =====================================================
   1) SHEETS
===================================================== */

const SHEET_RESULTADOS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=1201386360&single=true&output=csv";

const SHEET_PILOTOS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSGhBGHo7TZ_jtqT0HXBvYaV3g1TYBN5lEfYfq2phY0vvHTEyVkTfrVy6RrotDcqVOxm5C4JX9CdTBp/pub?gid=2063656949&single=true&output=csv";


/* =====================================================
   2) ELEMENTOS HTML
===================================================== */

const catSel = document.getElementById("categoriaSelectCampeonato");
const tablaBody = document.querySelector("#tablaCampeonato tbody");
const liderCard = document.getElementById("liderCard");

let resultados = [];
let pilotos = {};

cargarDatos();


/* =====================================================
   3) PARSE CSV
===================================================== */

function parseCSV(text){
  return text.split("\n").map(row =>
    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
       .map(c => c.replace(/^"|"$/g,'').trim())
  );
}


/* =====================================================
   4) CARGAR DATOS
===================================================== */

async function cargarDatos(){

  /* ----- RESULTADOS ----- */

  const rRes = await fetch(SHEET_RESULTADOS);
  const tRes = await rRes.text();
  const fRes = parseCSV(tRes);

  const hRes = fRes[0].map(h=>h.toUpperCase());

  const iFecha = hRes.indexOf("FECHA");
  const iCat   = hRes.indexOf("CATEGORIA");
  const iID    = hRes.indexOf("PILOTOID");
  const iPts   = hRes.indexOf("PUNTOS");

  resultados = fRes.slice(1).map(f=>({

    fecha: f[iFecha],
    categoria: f[iCat],
    pilotoID: f[iID],
    puntos: Number(f[iPts]) || 0

  }));


  /* ----- PILOTOS ----- */

  const rPil = await fetch(SHEET_PILOTOS);
  const tPil = await rPil.text();
  const fPil = parseCSV(tPil);

  const hPil = fPil[0].map(h=>h.toUpperCase());

  const iPID  = hPil.indexOf("ID");
  const iNom  = hPil.indexOf("NOMBRE");
  const iFoto = hPil.indexOf("FOTOURL");
  const iNum  = hPil.indexOf("NUMERO");

  fPil.slice(1).forEach(f=>{

    const id = f[iPID];

    pilotos[id] = {
      nombre: f[iNom],
      numero: f[iNum],
      foto: f[iFoto]
    };

  });

  cargarCategorias();

}


/* =====================================================
   5) CATEGORIAS
===================================================== */

function cargarCategorias(){

  const categorias = [...new Set(resultados.map(d=>d.categoria))];

  categorias.forEach(c=>{

    const o = document.createElement("option");
    o.value = c;
    o.textContent = c;

    catSel.appendChild(o);

  });

  catSel.onchange = actualizarCampeonato;

  actualizarCampeonato();

}


/* =====================================================
   6) CALCULAR CAMPEONATO
===================================================== */

function actualizarCampeonato(){

  const categoriaActual = catSel.value;

  const datosCat = resultados.filter(r =>
    r.categoria === categoriaActual
  );

  const puntosTotales = {};
  const victorias = {};

  const fechas = [...new Set(datosCat.map(d=>d.fecha))];


  /* ---- CALCULAR VICTORIAS ---- */

  fechas.forEach(fecha=>{

    const carrera = datosCat.filter(d=>d.fecha===fecha);

    const maxPts = Math.max(...carrera.map(d=>d.puntos));

    carrera.forEach(d=>{

      if(d.puntos === maxPts){

        victorias[d.pilotoID] =
          (victorias[d.pilotoID] || 0) + 1;

      }

    });

  });


  /* ---- SUMAR PUNTOS ---- */

  datosCat.forEach(d=>{

    puntosTotales[d.pilotoID] =
      (puntosTotales[d.pilotoID] || 0) + d.puntos;

  });


  /* ---- RANKING ---- */

  const ranking = Object.entries(puntosTotales)
    .sort((a,b)=>b[1]-a[1]);


  tablaBody.innerHTML = "";
  liderCard.innerHTML = "";

  if(ranking.length === 0) return;


  /* =====================================================
     7) TARJETA LIDER
  ===================================================== */

  const liderID = ranking[0][0];
  const liderPts = ranking[0][1];

  const piloto = pilotos[liderID] || {};

  const victoriasLider = victorias[liderID] || 0;

  const segundo = ranking[1];
  const diferencia = segundo ? liderPts - segundo[1] : 0;

  const foto = piloto.foto?.startsWith("http")
    ? piloto.foto
    : "pilotos/" + (piloto.foto || "default.jpg");

  liderCard.innerHTML = `
  <div class="lider-card">

    <img src="${foto}"
         onerror="this.src='pilotos/default.jpg'">

    <div class="lider-info">

      <h2>🥇 LÍDER DEL CAMPEONATO</h2>

      <h3>#${piloto.numero || ""} - ${piloto.nombre || liderID}</h3>

      <div class="puntos">${liderPts} puntos</div>

      <div class="extra">
        Categoría: ${categoriaActual}<br>
        🏆 Victorias: ${victoriasLider}<br>
        ${segundo ? `📊 Diferencia con 2°: +${diferencia} pts` : ""}
      </div>

    </div>

  </div>
  `;


  /* =====================================================
     8) TABLA CAMPEONATO
  ===================================================== */

  ranking.forEach(([pilotoID,total],i)=>{

    const p = pilotos[pilotoID] || {};

    const nombre =
      p.numero ? `#${p.numero} - ${p.nombre}` : pilotoID;

    tablaBody.innerHTML += `
      <tr>
        <td>${i+1}</td>

        <td>
          <a href="piloto.html?id=${pilotoID}">
            ${nombre}
          </a>
        </td>

        <td>${total}</td>

        <td>${victorias[pilotoID] || 0}</td>

      </tr>
    `;

  });

}

</script>
</body>
</html>
